name: Headless smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  server-smoke:
    name: Dedicated server boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept EULA
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt

      - name: Boot server and verify FML load complete
        run: |
          set -o pipefail
          timeout 900 ./gradlew runServer25 -PsmokeTest --console=plain --no-configuration-cache 2>&1 | tee server-smoke.log

      - name: Check server smoke-test markers
        if: always()
        run: |
          grep -q "Done (" server-smoke.log
          grep -q "OPENPERIPHERAL_SMOKE_TEST_OK" server-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore


  game-test:
    name: In-game game tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept EULA
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt

      - name: Run in-game game tests
        run: |
          set -o pipefail
          timeout 900 ./gradlew gameTestServer --console=plain --no-configuration-cache 2>&1 | tee game-test.log

      - name: Check game-test markers
        if: always()
        run: |
          grep -q "GAMETEST_ASSERTIONS_OK" game-test.log
          grep -q "OPENPERIPHERAL_GAMETEST_OK" game-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-log
          path: game-test.log
          if-no-files-found: ignore

  client-game-test:
    name: Client config GUI (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Software OpenGL/Xvfb is environment dependent; the server game tests are the required gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
          # lwjgl3ify's first-run desktop-entry creation requires the XDG data dir to exist.
          mkdir -p "$HOME/.local/share"

      - name: Boot client and open the config GUI
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 900 xvfb-run -a --server-args="-screen 0 1280x720x24"             ./gradlew runClient25 -PgameTest --console=plain --no-configuration-cache 2>&1 | tee client-game-test.log

      - name: Check client game-test marker
        if: always()
        run: grep -q "OPENPERIPHERAL_CLIENT_GAMETEST_OK" client-game-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-game-test-log
          path: client-game-test.log
          if-no-files-found: ignore

  client-smoke:
    name: Client boot (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Software OpenGL/Xvfb is environment dependent; keep this job non-blocking, but still produce the
    # marker check and logs so real client regressions are visible in the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
          # lwjgl3ify's first-run desktop-entry creation requires the XDG data dir to exist.
          mkdir -p "$HOME/.local/share"

      - name: Boot client and verify FML load complete
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 900 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew runClient25 -PsmokeTest --console=plain --no-configuration-cache 2>&1 | tee client-smoke.log

      - name: Check client smoke-test markers
        if: always()
        run: |
          grep -q "Setting user:" client-smoke.log
          grep -q "OPENPERIPHERAL_SMOKE_TEST_OK" client-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-log
          path: client-smoke.log
          if-no-files-found: ignore
